<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b32e0"/>
      <stop offset="0.55" stop-color="#4331d8"/>
      <stop offset="1" stop-color="#6d1fd8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9cdec"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37d5f2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#37d5f2" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6ff"/>
      <stop offset="1" stop-color="#b9bfe4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- beam from UFO to shield -->
  <path d="M256 150 L198 258 L314 258 Z" fill="url(#beam)"/>

  <!-- UFO -->
  <g>
    <ellipse cx="256" cy="128" rx="46" ry="40" fill="#eef1ff"/>
    <path d="M210 128 q46 34 92 0 q-6 -46 -46 -46 q-40 0 -46 46 Z" fill="#fbfcff"/>
    <ellipse cx="256" cy="150" rx="98" ry="26" fill="url(#disc)"/>
    <ellipse cx="256" cy="144" rx="98" ry="22" fill="#f7f9ff"/>
    <ellipse cx="256" cy="148" rx="98" ry="24" fill="none" stroke="#a9b0da" stroke-width="3"/>
    <circle cx="196" cy="150" r="8" fill="#8fa0e8"/>
    <circle cx="226" cy="158" r="8" fill="#8fa0e8"/>
    <circle cx="256" cy="161" r="8" fill="#8fa0e8"/>
    <circle cx="286" cy="158" r="8" fill="#8fa0e8"/>
    <circle cx="316" cy="150" r="8" fill="#8fa0e8"/>
  </g>

  <!-- shield -->
  <g>
    <path d="M256 232 L356 262 L356 340 Q356 424 256 466 Q156 424 156 340 L156 262 Z"
          fill="url(#shield)" stroke="#9aa3d4" stroke-width="6"/>
    <path d="M256 232 L356 262 L356 340 Q356 424 256 466 Z" fill="#dfe3f7" opacity="0.55"/>
    <path d="M216 344 L246 376 L306 300" fill="none" stroke="#4331d8"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
